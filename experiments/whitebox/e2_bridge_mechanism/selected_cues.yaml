# Cue selection for the dynamic bridge-cue pilot (spec section 5).
# Source: experiments/whitebox/e2_bridge_mechanism/selection/SELECTION_REPORT.md,
# generated by `python -m prematurestop.pipelines.bridge_mechanism.selection_report` from the
# frozen results/whitebox/e1_fixed_cue_matrix/qwen_llama/data/ (read-only). Deltas are vs NaturalNeutral
# on the strict paired set, canonical bootstrap; 40 cells cross-checked exactly
# against the bundle's published pcr_paired_deltas_stepwise.csv.
# Ranking rule (robustness first): # significant cells at each model's peak
# checkpoint (qwen14b@1, llama8b@5) over 4 datasets x 2 models, then worst-cell
# delta, then mean delta. Oracle conditions excluded (different evidence regime).
# Canonical condition definitions are unchanged (src/prematurestop/cues/fixed/registry.py).

selected_cues:
  - pilot_role: cue_1
    condition_id: Natural_PreRegisteredSufficiency
    condition_name: Fixed Sufficiency
    fixed_text: "The available evidence is sufficient to resolve the question, and the information presented is adequate for forming a reliable conclusion."
    selection_rank: 2
    selection_reason: >-
      Significant at the peak checkpoint in 8/8 model x dataset cells (4/4 pilot cells);
      worst cell +10.4pp, mean +20.2pp. Largest qwen14b PCR@1 effect of any natural cue
      (+25.6pp mean; hotpot +29.7 [24.7, 34.7], 2wiki +21.7 [16.3, 26.8]); llama8b
      PCR@2 hotpot +31.9 [26.9, 36.7], 2wiki +14.3 [10.2, 18.9]; PCR@5 +14.8pp mean.
      Oracle calibration (same claim over genuinely complete evidence) shows the effect
      does not depend on the claim being informative (+27.5 / +15.4pp).

  - pilot_role: cue_2
    condition_id: Natural_PreRegisteredSufficiencySaturation
    condition_name: Fixed Sufficiency Saturation
    fixed_text: "The available evidence is sufficient to resolve the question, and additional searching is unlikely to materially change the resulting conclusion."
    selection_rank: 1
    selection_reason: >-
      Significant at the peak checkpoint in 8/8 cells (4/4 pilot cells); best worst-cell
      delta of any candidate (+11.9pp), mean +20.0pp. Largest llama8b PCR@5 effect
      (+16.1pp mean) and PCR@2 hotpot +34.8 [29.8, 39.5], 2wiki +16.6 [12.2, 21.2];
      qwen14b PCR@1 hotpot +27.7 [22.7, 32.9], 2wiki +18.3 [12.8, 23.7]. Largest evidence
      loss of any cue (1.7pp mean), i.e. strongest sign of evidence left unread.

notes:
  - >-
    The two selected cues are statistically indistinguishable in the canonical results
    (no-stacking finding). Kept deliberately (decision 1, 2026-10-07): it isolates the
    sufficiency mechanism from its wording, which is itself reportable.
  - >-
    Next-ranked candidates, not selected: Natural_search_match_source (8/8, worst +7.1,
    mean +11.5; source-attached ablation), Natural_search_match_cue (8/8, worst +4.6,
    mean +9.5). Natural_source_coverage is weakest (3/8 cells).
  - >-
    In the canonical data, llama8b's effect at hotpot/2wiki peaks at PCR@2 (not @5 as in
    the 4-dataset average); the pilot reports PCR@1/2/3/5/10/30 for both models.
  - >-
    2026-10-11 redesign (Zhen's review, option B): Sufficiency carries the primary
    structure / truth / selection contrasts (entity-conditioned, unsupported-bridge,
    K=1 vs K=3 arms); Saturation keeps a fixed arm and one K=3 bridge arm as a
    replication of dynamic-vs-fixed and of the mechanism comparison on dynamic cues.
